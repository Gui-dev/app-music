pre-commit:
  parallel: true
  commands:
    server-lint:
      glob: "apps/server/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/server lint
    server-format:
      glob: "apps/server/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/server format
    mobile-lint:
      glob: "apps/mobile/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/mobile lint
    mobile-format:
      glob: "apps/mobile/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/mobile format
    shared-lint:
      glob: "shared/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/shared lint
    shared-format:
      glob: "shared/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/shared format

pre-push:
  parallel: true
  commands:
    server-typecheck:
      run: pnpm --filter @app-music/server typecheck
    server-test:
      run: pnpm --filter @app-music/server test
    mobile-typecheck:
      run: pnpm --filter @app-music/mobile typecheck
    shared-typecheck:
      run: pnpm --filter @app-music/shared typecheck
