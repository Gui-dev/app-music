pre-commit:
  parallel: true
  commands:
    server-check:
      glob: "apps/server/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/server check
    mobile-check:
      glob: "apps/mobile/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/mobile check
    shared-check:
      glob: "shared/src/**/*.{ts,tsx}"
      run: pnpm --filter @app-music/shared check

pre-push:
  parallel: true
  commands:
    server-typecheck:
      run: pnpm --filter @app-music/server typecheck
    server-test:
      run: pnpm --filter @app-music/server test
    mobile-typecheck:
      run: pnpm --filter @app-music/mobile typecheck
    shared-typecheck:
      run: pnpm --filter @app-music/shared typecheck
